<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Расписание</title>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Расписание"/>
  <meta name="theme-color" content="#ffffff"/>
  <link rel="manifest" href="./manifest.json"/>
  <link rel="apple-touch-icon" href="icon-512.png"/>
  <script>
    window.__tgScriptLoaded = new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.async = true;
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };
      document.head.appendChild(s);
      setTimeout(function () { resolve(false); }, 1000);
    });
  </script>
  <style>
    :root {
      --bg: #fafafa; --surf: #fff; --line: #e4e4e7;
      --text: #111; --sub: #71717a;
      --acc: #111; --acc-text: #fff;
      --danger: #dc2626;
    }
    [data-theme="dark"] {
      --bg: #0a0a0a; --surf: #141414; --line: #262626;
      --text: #fafafa; --sub: #a1a1aa;
      --acc: #fafafa; --acc-text: #0a0a0a;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; overscroll-behavior: none;
      font-size: 15px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'tnum';
    }
    #app { max-width: 520px; margin: 0 auto; padding: 0 16px 96px; }
    button { font: inherit; color: inherit; }

    .topbar { display: flex; align-items: flex-end; justify-content: space-between; padding: 28px 0 20px; }
    .topbar h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .topbar .sub { font-size: 13px; color: var(--sub); margin-top: 3px; }
    .ibtn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surf); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); }
    .ibtn svg { width: 16px; height: 16px; }

    .page { display: none; }
    .page.active { display: block; }

    .dgrid { display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .dbn { position: relative; background: var(--surf); border: none; border-right: 1px solid var(--line); padding: 12px 0; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--sub); }
    .dbn:last-child { border-right: none; }
    .dbn.today::after { content: ''; position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--danger); }
    .dbn.active { background: var(--acc); color: var(--acc-text); }

    .card { background: var(--surf); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }

    .ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
    .gbtn { background: var(--surf); border: none; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 11px 2px; cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; color: var(--text); }
    .gbtn.active { background: var(--acc); color: var(--acc-text); }

    .empty-s { padding: 44px 0; text-align: center; color: var(--sub); font-size: 14px; }

    .ghead { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .ghead .gname { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .ghead .gsub { font-size: 12px; color: var(--sub); margin-top: 2px; }

    .lesson { display: flex; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
    .lesson:last-child { border-bottom: none; }
    .lnum { width: 22px; flex-shrink: 0; font-size: 13px; font-weight: 700; color: var(--sub); padding-top: 2px; }
    .lbody { flex: 1; min-width: 0; }
    .lrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 1px 0; }
    .lsubj { font-size: 14px; font-weight: 500; }
    .lsubj.miss { color: var(--sub); }
    .lroom { font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; flex-shrink: 0; }
    .note-row { padding: 7px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--sub); background: var(--bg); }
    .note-row:last-child { border-bottom: none; }

    .pills { display: flex; gap: 6px; margin-bottom: 16px; }
    .pill { flex: 1; background: var(--surf); border: 1px solid var(--line); border-radius: 8px; padding: 9px 0; font-size: 13px; font-weight: 600; color: var(--sub); cursor: pointer; text-align: center; }
    .pill.active { background: var(--acc); color: var(--acc-text); border-color: var(--acc); }

    .cl-item { display: grid; grid-template-columns: 30px 1fr auto 1fr; align-items: center; gap: 4px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .cl-num { font-size: 13px; font-weight: 700; color: var(--sub); }
    .cl-t { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .cl-part-l, .cl-part-r { display: flex; flex-direction: column; }
    .cl-part-r { text-align: right; }
    .cl-meal { font-size: 11px; color: var(--sub); text-align: center; }
    .cl-break { padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--sub); text-align: center; background: var(--bg); }
    .cl-list > :last-child { border-bottom: none; }

    .row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
    .row-title { font-size: 15px; font-weight: 600; }
    .chevron { color: var(--sub); }

    .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surf); border-top: 1px solid var(--line); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; cursor: pointer; font-size: 11px; font-weight: 600; color: var(--sub); border: none; background: none; }
    .nb svg { width: 20px; height: 20px; }
    .nb.active { color: var(--text); }
  </style>
</head>
<body>
<div id="app">

  <div id="page-schedule" class="page active">
    <div class="topbar">
      <div><h1>Расписание</h1><div class="sub" id="date-line"></div></div>
      <button class="ibtn" id="theme-btn" onclick="toggleTheme()" aria-label="Тема">
        <svg id="theme-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>

    <div class="dgrid" id="gdgrid">
      <button class="dbn" data-gday="monday"    onclick="selectGroupDay('monday')">Пн</button>
      <button class="dbn" data-gday="tuesday"   onclick="selectGroupDay('tuesday')">Вт</button>
      <button class="dbn" data-gday="wednesday" onclick="selectGroupDay('wednesday')">Ср</button>
      <button class="dbn" data-gday="thursday"  onclick="selectGroupDay('thursday')">Чт</button>
      <button class="dbn" data-gday="friday"    onclick="selectGroupDay('friday')">Пт</button>
      <button class="dbn" data-gday="saturday"  onclick="selectGroupDay('saturday')">Сб</button>
    </div>

    <div class="card" id="glist-card" style="margin-bottom:16px;"></div>
    <div class="card" id="glessons-card" style="display:none;"></div>
  </div>

  <div id="page-calls" class="page">
    <div class="topbar"><div><h1>Звонки</h1></div></div>
    <div class="pills">
      <button class="pill active" id="pill-monday"   onclick="showCalls('monday')">Пн</button>
      <button class="pill"        id="pill-thursday" onclick="showCalls('thursday')">Чт</button>
      <button class="pill"        id="pill-other"    onclick="showCalls('other')">Другие дни</button>
    </div>
    <div class="card" id="calls-out"></div>
  </div>

  <div id="page-other" class="page">
    <div class="topbar"><div><h1>Другое</h1></div></div>
    <div class="card">
      <div class="row" onclick="openSupport()">
        <div class="row-title">Написать в поддержку</div>
        <div class="chevron"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg></div>
      </div>
    </div>
  </div>

</div>

<nav class="bnav">
  <button class="nb active" id="nav-schedule" onclick="setPage('schedule')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
    Расписание
  </button>
  <button class="nb" id="nav-calls" onclick="setPage('calls')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Звонки
  </button>
  <button class="nb" id="nav-other" onclick="setPage('other')">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
    Другое
  </button>
</nav>


<script>
const STATIC_BASE = './schedule';
const SUPPORT = 'ueaio';
const THEME_KEY = 'theme';
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];

let tg = null;
let isTgWebApp = false;
let gDay = null, gSelectedGroup = null;
const GROUPS_CACHE = {};
const NON_LESSON_RE = /^классный\s*час/i;

async function initTelegram() {
  await window.__tgScriptLoaded;
  tg = window.Telegram?.WebApp || null;
  isTgWebApp = !!(tg && (tg.initData || (tg.initDataUnsafe && Object.keys(tg.initDataUnsafe).length)));
  if (isTgWebApp) {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
    tg.onEvent?.('themeChanged', () => {
      if (localStorage.getItem(THEME_KEY)) return;
      if (tg.colorScheme === 'dark' || tg.colorScheme === 'light') applyTheme(tg.colorScheme);
    });
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function selectGroupDay(d) {
  gDay = d;
  gSelectedGroup = null;
  document.querySelectorAll('#gdgrid .dbn').forEach(b => b.classList.toggle('active', b.dataset.gday === d));
  document.getElementById('glessons-card').style.display = 'none';
  await loadGroupsDay(d);
  renderGroupList();
}

async function loadGroupsDay(d) {
  if (GROUPS_CACHE[d] && GROUPS_CACHE[d] !== 'error') return;
  document.getElementById('glist-card').innerHTML = '<div class="empty-s">Загрузка…</div>';
  try {
    const res = await fetch(`${STATIC_BASE}/groups/${d}.json?ts=${Date.now()}`, {cache: 'no-store'});
    if (!res.ok) throw 0;
    GROUPS_CACHE[d] = await res.json();
  } catch {
    GROUPS_CACHE[d] = 'error';
  }
}

function renderGroupList() {
  const card = document.getElementById('glist-card');
  const data = GROUPS_CACHE[gDay];
  if (data === 'error') { card.innerHTML = '<div class="empty-s">Данные ещё не загружены</div>'; return; }
  const names = Object.keys(data?.groups || {});
  if (!names.length) { card.innerHTML = '<div class="empty-s">Замен на этот день нет</div>'; return; }
  card.innerHTML = '<div class="ggrid">' + names.map(name =>
    `<button class="gbtn${name === gSelectedGroup ? ' active' : ''}" onclick="selectGroup('${name.replace(/'/g, "\\'")}')">${escapeHtml(name)}</button>`
  ).join('') + '</div>';
}

function splitSubgroups(l) {
  const subjects = (l.subject || '').split(/,\s*/);
  const rooms = (l.classroom || '').split(/,\s*/);
  if (subjects.length < 2 || subjects.length !== rooms.length) {
    return [{subject: l.subject, classroom: l.classroom}];
  }
  return subjects.map((subject, i) => ({subject: subject.trim(), classroom: rooms[i].trim()}));
}

function selectGroup(name) {
  const card = document.getElementById('glessons-card');
  if (name === gSelectedGroup) {
    gSelectedGroup = null;
    card.style.display = 'none';
    renderGroupList();
    return;
  }
  gSelectedGroup = name;
  const data = GROUPS_CACHE[gDay];
  const lessons = (data.groups[name] || []).slice().sort((a, b) => a.n - b.n);
  card.style.display = '';

  let rows = '';
  if (!lessons.length) {
    rows = '<div class="note-row">На этот день занятий нет</div>';
  } else {
    const bySlot = new Map(lessons.map(l => [l.n, l]));
    let n = 0;
    for (let slot = 1; slot <= lessons[lessons.length - 1].n; slot++) {
      const l = bySlot.get(slot);
      if (!l) {
        rows += `<div class="lesson"><div class="lnum">${++n}</div><div class="lbody"><div class="lrow"><span class="lsubj miss">—</span></div></div></div>`;
        continue;
      }
      if (l.subject && NON_LESSON_RE.test(l.subject)) {
        rows += '<div class="note-row">Классный час</div>';
        continue;
      }
      n++;
      rows += `<div class="lesson"><div class="lnum">${n}</div><div class="lbody">${splitSubgroups(l).map(s =>
        `<div class="lrow"><span class="lsubj${s.subject ? '' : ' miss'}">${s.subject ? escapeHtml(s.subject) : '—'}</span>${s.classroom ? `<span class="lroom">${escapeHtml(s.classroom)}</span>` : ''}</div>`
      ).join('')}</div></div>`;
    }
  }

  const dateLine = data.source_date ? ` · ${escapeHtml(data.source_date)}` : '';
  card.innerHTML = `
    <div class="ghead"><div class="gname">${escapeHtml(name)}</div><div class="gsub">${escapeHtml(data.day_title)}${dateLine}</div></div>
    ${rows}`;
  renderGroupList();
  card.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', t === 'dark' ? '#0a0a0a' : '#ffffff');
  tg?.setHeaderColor?.(t === 'dark' ? '#0a0a0a' : '#ffffff');
  tg?.setBackgroundColor?.(t === 'dark' ? '#0a0a0a' : '#fafafa');
  document.getElementById('theme-icon').innerHTML = t === 'light'
    ? '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>'
    : '<path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z"/>';
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) { applyTheme(saved); return; }
  applyTheme(tg?.colorScheme === 'dark' ? 'dark' : 'light');
}

function toggleTheme() {
  const t = (document.documentElement.getAttribute('data-theme') || 'light') === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, t);
  applyTheme(t);
}

function setPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p)?.classList.add('active');
  document.querySelectorAll('.nb').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + p)?.classList.add('active');
  if (p === 'schedule' && !gDay) {
    const t = DAYS[new Date().getDay()];
    selectGroupDay(t === 'sunday' ? 'monday' : t);
  }
  window.scrollTo(0, 0);
}


const CALLS = {
  monday: {
    lessons: [
      {n:1, p1:'8:30-9:15',   p2:'9:20-10:05',  meal:null},
      {n:2, p1:'10:15-11:00', p2:'11:15-12:00',  meal:'11:00-11:15'},
      {n:3, p1:'13:05-13:50', p2:'13:55-14:40',  meal:null},
      {n:4, p1:'14:45-15:30', p2:'15:35-16:20',  meal:null},
    ],
    breaks: [{after:2, text:'Обед 12:00-12:30'}, {after:2, text:'Классные часы 12:30-13:00'}],
  },
  thursday: {
    lessons: [
      {n:1, p1:'8:30-9:15',   p2:'9:20-10:05',  meal:null},
      {n:2, p1:'10:15-11:00', p2:'11:15-12:00',  meal:'11:00-11:15'},
      {n:3, p1:'12:30-13:15', p2:'13:20-14:05',  meal:null},
      {n:4, p1:'14:10-14:55', p2:'15:00-15:45',  meal:null},
    ],
    breaks: [{after:2, text:'Обед 12:00-12:30'}, {after:4, text:'Классные часы (1 курс) 15:50-16:20'}],
  },
  other: {
    lessons: [
      {n:1, p1:'8:30-9:15',   p2:'9:20-10:05',  meal:null},
      {n:2, p1:'10:15-11:00', p2:'11:15-12:00',  meal:'11:00-11:15'},
      {n:3, p1:'12:40-13:25', p2:'13:30-14:15',  meal:null},
      {n:4, p1:'14:25-15:10', p2:'15:15-16:00',  meal:null},
      {n:5, p1:'16:05-16:50', p2:'16:55-17:40',  meal:null},
    ],
    breaks: [{after:2, text:'Обед 12:00-12:40'}],
  },
};

function showCalls(tab) {
  ['monday','thursday','other'].forEach(k =>
    document.getElementById('pill-'+k).classList.toggle('active', k === tab));
  const d = CALLS[tab];
  let html = '<div class="cl-list">';
  d.lessons.forEach(l => {
    html += `<div class="cl-item">
      <div class="cl-num">${l.n}</div>
      <div class="cl-part-l"><span class="cl-t">${l.p1}</span></div>
      <div class="cl-meal">${l.meal ? 'Обед ' + l.meal : ''}</div>
      <div class="cl-part-r"><span class="cl-t">${l.p2}</span></div>
    </div>`;
    d.breaks.filter(b => b.after === l.n).forEach(b => {
      html += `<div class="cl-break">${b.text}</div>`;
    });
  });
  document.getElementById('calls-out').innerHTML = html + '</div>';
}

function openSupport() {
  const url = 'https://t.me/' + SUPPORT;
  if (isTgWebApp && tg && typeof tg.openTelegramLink === 'function') tg.openTelegramLink(url);
  else window.open(url, '_blank', 'noopener');
}

window.addEventListener('DOMContentLoaded', async () => {
  await initTelegram();
  initTheme();

  const s = new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('date-line').textContent = s[0].toUpperCase() + s.slice(1);

  const today = DAYS[new Date().getDay()];
  document.querySelector(`[data-gday="${today}"]`)?.classList.add('today');

  showCalls('monday');
  setPage('schedule');
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=23', { scope: './' });
}
</script>
</body>
</html>
