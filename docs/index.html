<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
window.tgReady = new Promise(resolve => {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-web-app.js';
  s.onload = () => resolve(true);
  s.onerror = () => resolve(false);
  setTimeout(() => resolve(false), 1000);
  document.head.appendChild(s);
});
</script>
<style>
:root { --bg:#fff; --fg:#0a0a0a; --mute:#777; --line:#e6e6e6; --accent:#e5391f; }
[data-theme=dark] { --bg:#0a0a0a; --fg:#f2f2f2; --mute:#a0a0a0; --line:#292929; --accent:#ff5a3d; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { font:15px/1.5 -apple-system,"Helvetica Neue","Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
  min-height:100dvh; overscroll-behavior:none; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
main { max-width:480px; margin:0 auto; padding:0 20px 112px; }
.page { display:none; }
.page.on { display:block; }

header { display:flex; justify-content:space-between; align-items:flex-end; padding:40px 0 28px; }
h1 { font-size:28px; font-weight:600; letter-spacing:-.03em; line-height:1.1; }
.date { margin-top:6px; font-size:13px; color:var(--mute); }
.theme { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }

.tabs { display:flex; border-bottom:1px solid var(--line); margin-bottom:24px; }
.tabs button { flex:1; padding:12px 0; font-size:14px; color:var(--mute); border-bottom:2px solid transparent; margin-bottom:-1px; position:relative; }
.tabs button.on { color:var(--fg); border-color:var(--fg); }
.tabs button.today::after { content:""; position:absolute; top:10px; right:calc(50% - 14px); width:4px; height:4px; background:var(--accent); }

.groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); border-top:1px solid var(--line); border-left:1px solid var(--line); margin-bottom:32px; }
.groups button { padding:12px 4px; font-size:13px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.groups button.on { background:var(--fg); color:var(--bg); }

.note { padding:48px 0; text-align:center; font-size:14px; color:var(--mute); }

.sheet-head { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:12px; border-bottom:1px solid var(--fg); }
.sheet-head b { font-size:20px; font-weight:600; letter-spacing:-.02em; }
.sheet-head span { font-size:12px; color:var(--mute); }
.row { display:grid; grid-template-columns:28px 1fr; padding:14px 0; border-bottom:1px solid var(--line); }
.n { font-size:12px; color:var(--mute); padding-top:3px; }
.timed .n { padding-top:23px; }
.calls-row .n { padding-top:17px; }
.line { display:flex; justify-content:space-between; gap:16px; }
.room { color:var(--mute); font-size:13px; flex-shrink:0; }
.dim { color:var(--mute); }
.time { font-size:12px; color:var(--mute); margin-bottom:2px; }
.sep { padding:10px 0; border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }

.call-parts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:center; gap:12px; }
.call-parts.with-meal { grid-template-columns:minmax(0,1fr) minmax(72px,1.1fr) minmax(0,1fr); gap:6px; }
.call-part { min-width:0; }
.call-part:last-child { text-align:right; }
.call-part-label { display:block; margin-bottom:3px; color:var(--mute); font-size:11px; line-height:1.2; }
.call-part-time { font-size:15px; line-height:1.35; font-weight:500; white-space:nowrap; }
.call-between { color:var(--mute); font-size:12px; line-height:1.3; text-align:center; }
.call-sep { padding:10px 0; border-bottom:1px solid var(--line); color:var(--mute); font-size:12px; letter-spacing:0; text-transform:none; }
#other .link { border-top:0; }
@media (max-width:360px) {
  .call-parts { gap:8px; }
  .call-parts.with-meal { gap:4px; }
  .call-part-time { font-size:13px; }
  .call-between { font-size:11px; }
}

.link { display:flex; justify-content:space-between; width:100%; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:left; }

nav { position:fixed; inset:auto 0 0; display:flex; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0); }
nav button { flex:1; padding:16px 0; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); }
nav button.on { color:var(--fg); box-shadow:inset 0 2px 0 var(--fg); }
</style>
</head>
<body>
<main>
  <section class="page on" id="schedule">
    <header>
      <div><h1>Расписание</h1><div class="date" id="date"></div></div>
      <button class="theme" id="theme">Тема</button>
    </header>
    <div class="tabs" id="days"></div>
    <div id="groups"></div>
    <div id="sheet"></div>
  </section>

  <section class="page" id="calls">
    <header><h1>Звонки</h1></header>
    <div class="tabs" id="call-tabs"></div>
    <div id="call-list"></div>
  </section>

  <section class="page" id="other">
    <header><h1>Другое</h1></header>
    <button class="link" id="support"><span>Написать в поддержку</span><span class="dim">→</span></button>
  </section>
</main>

<nav id="nav">
  <button data-page="schedule" class="on">Расписание</button>
  <button data-page="calls">Звонки</button>
  <button data-page="other">Другое</button>
</nav>

<script>
const BASE = './schedule';
const SUPPORT = 'ueaio';
const WEEK = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
const DAYS = [['monday', 'Пн'], ['tuesday', 'Вт'], ['wednesday', 'Ср'], ['thursday', 'Чт'], ['friday', 'Пт'], ['saturday', 'Сб']];
const CALLS = {
  monday: {
    title: 'Пн',
    lessons: [[1, '8:30–9:15', '9:20–10:05'], [2, '10:15–11:00', '11:15–12:00', 'Обед: 11:00–11:15'], [3, '13:05–13:50', '13:55–14:40'], [4, '14:45–15:30', '15:35–16:20']],
    after: { 2: ['Обед: 12:00–12:30', 'Классные часы: 12:30–13:00'] },
  },
  thursday: {
    title: 'Чт',
    lessons: [[1, '8:30–9:15', '9:20–10:05'], [2, '10:15–11:00', '11:15–12:00', 'Обед: 11:00–11:15'], [3, '12:30–13:15', '13:20–14:05'], [4, '14:10–14:55', '15:00–15:45']],
    after: { 2: ['Обед: 12:00–12:30'], 4: ['Классные часы (1 курс): 15:50–16:20'] },
  },
  other: {
    title: 'Другие дни',
    lessons: [[1, '8:30–9:15', '9:20–10:05'], [2, '10:15–11:00', '11:15–12:00', 'Обед: 11:00–11:15'], [3, '12:40–13:25', '13:30–14:15'], [4, '14:25–15:10', '15:15–16:00'], [5, '16:05–16:50', '16:55–17:40']],
    after: { 2: ['Обед: 12:00–12:40'] },
  },
};
const CLASS_HOUR = /^классный\s*час/i;
const CLASS_HOUR_TIMES = { monday: '12:30–13:00' };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = WEEK[new Date().getDay()];
const cache = {};
let tg = null, inTelegram = false, day = null, group = null;

const tabs = (el, items, current, attr, extra = () => '') =>
  el.innerHTML = items.map(([key, label]) => `<button data-${attr}="${key}" class="${key === current ? 'on' : ''} ${extra(key)}">${label}</button>`).join('');

async function loadDay(d) {
  if (cache[d] && cache[d] !== 'error') return;
  $('groups').innerHTML = '<div class="note">Загрузка…</div>';
  try {
    const res = await fetch(`${BASE}/groups/${d}.json?ts=${Date.now()}`, { cache: 'no-store' });
    cache[d] = res.ok ? await res.json() : 'error';
  } catch {
    cache[d] = 'error';
  }
}

async function selectDay(d) {
  day = d;
  group = null;
  $('sheet').innerHTML = '';
  tabs($('days'), DAYS, day, 'day', k => k === today ? 'today' : '');
  await loadDay(d);
  renderGroups();
}

function renderGroups() {
  const data = cache[day];
  if (data === 'error') return $('groups').innerHTML = '<div class="note">Данные ещё не загружены</div>';
  const names = Object.keys(data.groups || {});
  if (!names.length) return $('groups').innerHTML = '<div class="note">Замен на этот день нет</div>';
  $('groups').innerHTML = '<div class="groups">' + names.map(n => `<button data-group="${esc(n)}" class="${n === group ? 'on' : ''}">${esc(n)}</button>`).join('') + '</div>';
}

function splitSubgroups({ subject, classroom }) {
  const subjects = (subject || '').split(/,\s*/);
  const rooms = (classroom || '').split(/,\s*/);
  return subjects.length > 1 && subjects.length === rooms.length
    ? subjects.map((s, i) => ({ subject: s.trim(), classroom: rooms[i].trim() }))
    : [{ subject, classroom }];
}

function lessonRows(lessons) {
  const times = day === 'thursday' ? [] : CALLS[day === 'monday' ? 'monday' : 'other'].lessons;
  if (!lessons.length) return '<div class="sep">На этот день занятий нет</div>';
  const bySlot = new Map(lessons.map(l => [l.n, l]));
  const last = Math.max(...bySlot.keys());
  let count = 0, html = '';
  for (let slot = 1; slot <= last; slot++) {
    const lesson = bySlot.get(slot);
    if (lesson?.subject && CLASS_HOUR.test(lesson.subject)) {
      const classHourTime = CLASS_HOUR_TIMES[day] ? `: ${CLASS_HOUR_TIMES[day]}` : '';
      html += `<div class="sep">Классный час${classHourTime}</div>`;
      continue;
    }
    const lines = lesson
      ? splitSubgroups(lesson).map(s => `<div class="line"><span class="${s.subject ? '' : 'dim'}">${s.subject ? esc(s.subject) : '—'}</span>${s.classroom ? `<span class="room">${esc(s.classroom)}</span>` : ''}</div>`).join('')
      : '<div class="line"><span class="dim">—</span></div>';
    const [, a, b] = times[count] || [];
    html += `<div class="row${a ? ' timed' : ''}"><div class="n">${++count}</div><div>${a ? `<div class="time">${a} | ${b}</div>` : ''}${lines}</div></div>`;
  }
  return html;
}

function selectGroup(name) {
  group = name === group ? null : name;
  renderGroups();
  if (!group) return $('sheet').innerHTML = '';
  const data = cache[day];
  const lessons = [...(data.groups[group] || [])].sort((a, b) => a.n - b.n);
  const date = data.source_date ? ` · ${esc(data.source_date)}` : '';
  $('sheet').innerHTML = `<div class="sheet-head"><b>${esc(group)}</b><span>${esc(data.day_title)}${date}</span></div>${lessonRows(lessons)}`;
  $('sheet').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

const callsKind = () => ({ monday: 'monday', thursday: 'thursday', sunday: 'monday' })[WEEK[new Date().getDay()]] || 'other';

function showCalls(kind) {
  const { lessons, after } = CALLS[kind];
  tabs($('call-tabs'), Object.entries(CALLS).map(([k, v]) => [k, v.title]), kind, 'call');
  $('call-list').innerHTML = lessons.map(([n, a, b, meal]) => {
    const breaks = (after[n] || []).map(text => `<div class="call-sep">${esc(text)}</div>`).join('');
    const middle = meal ? `<div class="call-between">${esc(meal)}</div>` : '';
    return `<div class="row calls-row"><div class="n">${n}</div><div class="call-parts${meal ? ' with-meal' : ''}"><div class="call-part"><span class="call-part-label">1-я часть</span><strong class="call-part-time">${esc(a)}</strong></div>${middle}<div class="call-part"><span class="call-part-label">2-я часть</span><strong class="call-part-time">${esc(b)}</strong></div></div></div>${breaks}`;
  }).join('');
}

function setPage(page) {
  document.querySelectorAll('.page').forEach(el => el.classList.toggle('on', el.id === page));
  document.querySelectorAll('#nav button').forEach(el => el.classList.toggle('on', el.dataset.page === page));
  if (page === 'schedule' && !day) selectDay(today === 'sunday' ? 'monday' : today);
  if (page === 'calls') showCalls(callsKind());
  scrollTo(0, 0);
}

function applyTheme(theme) {
  const dark = theme === 'dark';
  document.documentElement.dataset.theme = theme;
  document.querySelector('meta[name=theme-color]').content = dark ? '#0a0a0a' : '#ffffff';
  tg?.setHeaderColor?.(dark ? '#0a0a0a' : '#ffffff');
  tg?.setBackgroundColor?.(dark ? '#0a0a0a' : '#ffffff');
}

function openSupport() {
  const url = `https://t.me/${SUPPORT}`;
  inTelegram && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank', 'noopener');
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.day) selectDay(t.dataset.day);
  else if (t.dataset.group) selectGroup(t.dataset.group);
  else if (t.dataset.call) showCalls(t.dataset.call);
  else if (t.dataset.page) setPage(t.dataset.page);
  else if (t.id === 'theme') {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', next);
    applyTheme(next);
  } else if (t.id === 'support') openSupport();
});

addEventListener('DOMContentLoaded', async () => {
  await window.tgReady;
  tg = window.Telegram?.WebApp || null;
  inTelegram = !!(tg && (tg.initData || Object.keys(tg.initDataUnsafe || {}).length));
  if (inTelegram) {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
    tg.onEvent?.('themeChanged', () => localStorage.getItem('theme') || applyTheme(tg.colorScheme));
  }
  applyTheme(localStorage.getItem('theme') || (tg?.colorScheme === 'dark' ? 'dark' : 'light'));

  const date = new Date().toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  $('date').textContent = date[0].toUpperCase() + date.slice(1);
  setPage('schedule');
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js?v=24', { scope: './' });
</script>
</body>
</html>
